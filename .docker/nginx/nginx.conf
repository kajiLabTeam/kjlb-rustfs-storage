worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # ------------------------------------------------------------------
    # AWS SigV4 を壊さないための必須事項
    #
    # SigV4 は Host ヘッダとリクエストパスを署名対象に含める。
    # 以下のいずれかを行うと SignatureDoesNotMatch になる:
    #
    #   - サブパスで配信する (例: https://example.com/s3/)
    #     → S3 API は必ずルート (/) で配信する
    #   - パスの書き換え (proxy_pass の末尾に URI を付ける、rewrite, ~ 正規表現
    #     location との組み合わせなど)
    #     → proxy_pass は必ず「スキーム + upstream」のみで終える
    #   - Host ヘッダの差し替え
    #     → クライアントが送った値をそのまま渡す ($http_host)
    #   - HEAD を GET に変換する (nginx の既定動作)
    #     → proxy_cache_convert_head off
    # ------------------------------------------------------------------

    # WebSocket アップグレード用
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream rustfs_s3 {
        server rustfs:9000;
        keepalive 32;
    }

    upstream rustfs_console {
        server rustfs:9001;
        keepalive 8;
    }

    server {
        listen 80;
        server_name localhost;

        # Redirect HTTP to HTTPS (optional, uncomment if SSL is configured)
        # return 301 https://$host$request_uri;

        # コンソール。
        # 注意: S3 のパス形式では先頭セグメントがバケット名になるため、
        # location の prefix はバケット名と名前空間を共有する。
        # "rustfs" / "grafana" / "prometheus" という名前のバケットは作らないこと。
        location /rustfs/console {
            proxy_pass http://rustfs_console;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / SSE
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Grafana (profile: observability)。
        # observability profile を起動していない場合でも nginx が起動できるよう、
        # Docker の内蔵 DNS (127.0.0.11) で実行時に名前解決する。
        # upstream ブロックや固定の proxy_pass にすると、grafana 不在時に
        # "host not found in upstream" で nginx 自体が起動しなくなる。
        location /grafana/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $grafana_upstream http://grafana:3000;
            # パスは書き換えない ($request_uri をそのまま渡す)。
            # Grafana 側は GF_SERVER_SERVE_FROM_SUB_PATH=true で /grafana/ 前提。
            proxy_pass $grafana_upstream$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Grafana Live (WebSocket)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Prometheus (profile: observability)。
        # 認証機構を持たないため、公開環境では下の allow/deny か
        # Basic 認証で保護すること。
        location /prometheus/ {
            # allow 10.0.0.0/8;
            # allow 192.168.0.0/16;
            # deny all;

            resolver 127.0.0.11 valid=10s ipv6=off;
            set $prometheus_upstream http://prometheus:9090;
            # Prometheus は --web.route-prefix=/ でルート待ち受けなので、
            # ここで /prometheus/ を取り除いて渡す。
            rewrite ^/prometheus/?(.*)$ /$1 break;
            proxy_pass $prometheus_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # S3 API。ルートで配信し、パスは一切書き換えない。
        location / {
            # 末尾に URI を書かないこと (http://rustfs_s3/ は NG)。
            # URI を付けると nginx が正規化済みパスに置き換えてしまい署名が壊れる。
            proxy_pass http://rustfs_s3;
            proxy_http_version 1.1;

            # Host はクライアントが送った値をそのまま渡す。
            # $host はポート番号を落とすため、署名対象と食い違う場合がある。
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # HEAD を GET に変換させない (署名が壊れる)。
            proxy_cache_convert_head off;

            # 大容量オブジェクトの授受
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;

            # マルチパートアップロードや大きなオブジェクトに備えて長めに取る
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }

    # SSL Configuration (Example)
    #
    # TLS を nginx で終端する場合、クライアントは https://<server_name>/ に対して
    # 署名するため、server_name は実際に利用するホスト名と一致させること。
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name localhost;
    #
    #     ssl_certificate /etc/nginx/ssl/server.crt;
    #     ssl_certificate_key /etc/nginx/ssl/server.key;
    #
    #     # Restrict to modern TLS versions and ciphers. Operators copying this
    #     # example must keep at least these directives — without them, nginx
    #     # may negotiate older protocol versions that have known weaknesses.
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #     ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_tickets off;
    #     # add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # 上の 80 番の server ブロックと同じ location 定義をそのまま使う。
    #     # 特に proxy_pass に URI を付けないこと、Host に $http_host を渡すこと、
    #     # proxy_cache_convert_head off を必ず維持すること。
    # }
}
