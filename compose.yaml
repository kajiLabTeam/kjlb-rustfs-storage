services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    container_name: rustfs-server
    security_opt:
      - "no-new-privileges:true"
    # ホストへのポート公開はしない。S3 API とコンソールへのアクセスは
    # すべて nginx (profile: proxy) 経由に限定する。
    expose:
      - "9000" # S3 API
      - "9001" # Console
    environment:
      # SNSD (Single Node Single Disk) 構成
      # SNMD へ移行する場合は /data/rustfs{0...3} のように展開し、
      # ホスト側で各ディスクを ${RUSTFS_DATA_DIR}/rustfs0..3 にマウントする
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin} # CHANGEME
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin} # CHANGEME
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=/logs
      # 監視スタック (profile: observability) を併用する場合のみ .env で
      # RUSTFS_OBS_ENDPOINT=http://otel-collector:4318 を設定する
      - RUSTFS_OBS_ENDPOINT=${RUSTFS_OBS_ENDPOINT:-}
    volumes:
      - ${RUSTFS_DATA_DIR:-/srv/rustfs/data}:/data
      - ${RUSTFS_LOGS_DIR:-/srv/rustfs/logs}:/logs
    networks:
      - rustfs-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully

  # RustFS の実行ユーザ (10001:10001) に合わせてバインドマウント先の所有者を調整する。
  # bind mount のディレクトリは Docker が root 所有で作成するため、これが無いと起動に失敗する。
  volume-permission-helper:
    image: alpine:3.22
    user: root
    volumes:
      - ${RUSTFS_DATA_DIR:-/srv/rustfs/data}:/data
      - ${RUSTFS_LOGS_DIR:-/srv/rustfs/logs}:/logs
    command: >
      sh -c "chown -R 10001:10001 /data /logs && echo 'Volume permissions fixed'"
    restart: "no"

  # --- 監視スタック (profile: observability) ---
  # 起動: docker compose --profile observability up -d

  tempo-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 10001:10001 /var/tempo"]
    user: root
    volumes:
      - tempo_data:/var/tempo
    networks:
      - rustfs-network
    restart: "no"
    profiles:
      - observability

  tempo:
    image: grafana/tempo:2.10.5
    container_name: tempo
    user: "10001"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./.docker/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    # ホストへのポート公開はしない。参照は Grafana 経由。
    expose:
      - "3200" # Tempo API
      - "4317" # OTLP gRPC (otel-collector から)
    networks:
      - rustfs-network
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./.docker/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    # ホストへのポート公開はしない。参照は Grafana 経由。
    expose:
      - "3100"
    networks:
      - rustfs-network
    restart: unless-stopped
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-otlp-receiver"
      - "--web.enable-remote-write-receiver"
      # nginx の /prometheus/ 配下で配信する。
      # external-url は生成するリンクの絶対URL用。route-prefix=/ を明示して
      # 内部的にはルートで待ち受けさせ、prefix の除去は nginx 側で行う。
      # (route-prefix を /prometheus/ にすると自己スクレイプと
      #  Grafana データソースが 404 になる)
      - "--web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost/prometheus/}"
      - "--web.route-prefix=/"
    volumes:
      - ./.docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # ホストへのポート公開はしない。アクセスは nginx (profile: proxy) 経由に限定する。
    expose:
      - "9090"
    networks:
      - rustfs-network
    restart: unless-stopped
    profiles:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: otel-collector
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    volumes:
      - ./.docker/observability/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector.yml:ro
    # ホストへのポート公開はしない。テレメトリの受信は同一ネットワーク内に限定する。
    # ホスト外のアプリからも送信したい場合のみ ports で 4317/4318 を公開する。
    expose:
      - "4317"  # OTLP gRPC
      - "4318"  # OTLP HTTP
      - "8888"  # Collector 自身のメトリクス (Prometheus が scrape)
      - "8889"  # アプリケーションメトリクス (Prometheus が scrape)
      - "13133" # ヘルスチェック
    networks:
      - rustfs-network
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      - tempo
      - prometheus
      - loki

  grafana:
    image: grafana/grafana:12.4.6
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin} # CHANGEME
      # nginx の /grafana/ 配下で配信するための設定。
      # 外部から見えるホスト名が localhost 以外なら .env で GRAFANA_ROOT_URL を上書きする。
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./.docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.docker/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    # ホストへのポート公開はしない。アクセスは nginx (profile: proxy) 経由に限定する。
    expose:
      - "3000"
    networks:
      - rustfs-network
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      - prometheus
      - tempo
      - loki

  # --- リバースプロキシ (profile: proxy) ---
  # 起動: docker compose --profile proxy up -d
  # TLS を使う場合は .docker/nginx/ssl/ に証明書を置き、nginx.conf の 443 ブロックを有効化する

  nginx:
    image: nginx:1.29-alpine
    container_name: nginx-proxy
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.docker/nginx/ssl:/etc/nginx/ssl:ro
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /var/log/nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      - rustfs-network
    restart: unless-stopped
    profiles:
      - proxy
    depends_on:
      - rustfs

networks:
  rustfs-network:
    driver: bridge

volumes:
  tempo_data:
    driver: local
  loki_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
