services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    container_name: rustfs-server
    security_opt:
      - "no-new-privileges:true"
    # S3 API とコンソールをホストへ直接公開する。
    # 外部への公開が必要な場合は、別途用意するリバースプロキシから
    # これらのポートへ接続する。
    ports:
      - "${RUSTFS_S3_PORT:-9000}:9000" # S3 API
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001" # Console
    environment:
      # SNSD (Single Node Single Disk) 構成
      # SNMD へ移行する場合は /data/rustfs{0...3} のように展開し、
      # ホスト側で各ディスクを ${RUSTFS_DATA_DIR}/rustfs0..3 にマウントする
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin} # CHANGEME
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin} # CHANGEME
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=/logs
      # 監視スタックは別リポジトリ (kjlb-observability-stack) に分離した。
      # 使う場合は .env で RUSTFS_OBS_ENDPOINT=http://host.docker.internal:4318
      # を設定する（監視スタックの otel-collector がホストへ公開する OTLP HTTP ポート）。
      - RUSTFS_OBS_ENDPOINT=${RUSTFS_OBS_ENDPOINT:-}
    volumes:
      - ${RUSTFS_DATA_DIR:-/srv/rustfs/data}:/data
      - ${RUSTFS_LOGS_DIR:-/srv/rustfs/logs}:/logs
    networks:
      - rustfs-network
    restart: unless-stopped
    # host.docker.internal で別リポジトリ (kjlb-observability-stack) の
    # otel-collector にホスト経由で到達できるようにする (Linux 用)。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully

  # RustFS の実行ユーザ (10001:10001) に合わせてバインドマウント先の所有者を調整する。
  # bind mount のディレクトリは Docker が root 所有で作成するため、これが無いと起動に失敗する。
  volume-permission-helper:
    image: alpine:3.22
    user: root
    volumes:
      - ${RUSTFS_DATA_DIR:-/srv/rustfs/data}:/data
      - ${RUSTFS_LOGS_DIR:-/srv/rustfs/logs}:/logs
    command: >
      sh -c "chown -R 10001:10001 /data /logs && echo 'Volume permissions fixed'"
    restart: "no"

networks:
  rustfs-network:
    driver: bridge
