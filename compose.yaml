services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    container_name: rustfs-server
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    environment:
      # SNSD (Single Node Single Disk) 構成
      # SNMD へ移行する場合は /data/rustfs{0...3} のように展開し、
      # volumes に rustfs_data_1..3 を追加する
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin} # CHANGEME
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin} # CHANGEME
      - RUSTFS_OBS_LOGGER_LEVEL=info
    volumes:
      - rustfs_data_0:/data/rustfs0
      - logs:/app/logs
    networks:
      - rustfs-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully

  # RustFS の実行ユーザ (10001:10001) に合わせて named volume の所有者を調整する
  volume-permission-helper:
    image: alpine:3.22
    volumes:
      - rustfs_data_0:/data0
      - logs:/logs
    command: >
      sh -c "chown -R 10001:10001 /data0 /logs && echo 'Volume permissions fixed'"
    restart: "no"

networks:
  rustfs-network:
    driver: bridge

volumes:
  rustfs_data_0:
    driver: local
  logs:
    driver: local
